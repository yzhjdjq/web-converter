services:
  redis:
    image: redis:8.6.2-alpine3.23
    container_name: c-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - converter-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1s

  postgres:
    image: c/postgres:16.13-alpine3.22
    container_name: c-postgres
    build:
      context: ./postgres
      dockerfile: ./Dockerfile
    user: 1000:1000
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - converter-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  backend:
    image: c/backend
    container_name: c-backend
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    networks:
      - converter-network
    depends_on:
      postgres:
        condition: service_healthy
        restart: false
      redis:
        condition: service_healthy
        restart: false
    user: 1000:1000
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_CSRF_COOKIE_NAME: ${JWT_ACCESS_CSRF_COOKIE_NAME}
      JWT_REFRESH_CSRF_COOKIE_NAME: ${JWT_REFRESH_CSRF_COOKIE_NAME}
      JWT_ACCESS_COOKIE_NAME: ${JWT_ACCESS_COOKIE_NAME}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SALT_ROUNDS: ${SALT_ROUNDS}
      BACKEND_DOMAIN: ${DOMAIN_NAME}
      FRONTEND_URL: https://${DOMAIN_NAME}
    restart: on-failure:5
    healthcheck:
      test: curl -f http://localhost:8000/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  frontend:
    image: c/frontend
    container_name: c-frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    networks:
      - converter-network
    depends_on:
      - backend
    environment:
      VITE_API_URL: https://${DOMAIN_NAME}
    restart: on-failure:5

  nginx:
    image: c/nginx
    container_name: c-nginx
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
    environment:
      SERVER_NAME: ${DOMAIN_NAME}
    ports:
      - 80:80
      - 443:443
    networks:
      - converter-network
    depends_on:
      - backend
      - frontend
    restart: on-failure:3

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/pg_data

networks:
  converter-network:
    name: converter-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.80.0.0/24
